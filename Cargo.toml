[workspace]
resolver = "2"
members = [
    "engine/deterministic",
    "engine/bridge_types",
    "engine/state_hash",
    "engine/crypto",
    "engine/vm_runtime",
    "build/bytecode_compiler",
    "engine/bevy_runtime",
    "engine/vm_bevy_bridge",
    # ── Phase 11 ──
    "engine/netcode",
    "server/simulation",
    "server/validator",
    "server/replay_engine",
    # ── Phase 12 ──
    "server/key_exchange",
    "server/hot_update_cdn",
    # ── Phase 13 ──
    "engine/protocol",
    "server/gateway",
    # ── Phase 14 ──
    "engine/shadow_vm",
    "server/anti_cheat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# ── 確定性浮點 ──
# pure Rust softfloat（forked from const_soft_float, by koute），精確釘選
softfloat = "=1.0.0"

# ── RNG ──
# 保留於 workspace 層級供未來 crate 使用
# （engine/deterministic 自行實作 PCG，不直接依賴）
rand_pcg = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }

# ── 雜湊 ──
blake3 = "1"

# ── 序列化 ──
bincode = "1"
serde = { version = "1", features = ["derive"] }

# ── 加密 ──
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }
zeroize = { version = "1", features = ["derive"] }

# ── Rhai 腳本引擎 ──
rhai = { version = "1", features = ["only_i64", "no_module", "no_closure", "serde"] }

# ── CLI ──
clap = { version = "4", features = ["derive"] }

# ── 錯誤處理 ──
thiserror = "2"

# ── 非同步 ──
async-trait = "0.1"

# ── Phase 13: Server Gateway ──
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
wtransport = "0.5"
tower = "0.5"

# ── 日誌 ──
tracing = "0.1"

# ── 遊戲引擎 ──
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
] }

# ── 物理引擎 ──
bevy_rapier3d = { version = "0.29", default-features = false, features = ["dim3"] }

# ── Phase 11: Replay 壓縮 ──
flate2 = "1"
hex = "0.4"
proptest = "1"
