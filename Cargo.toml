[workspace]
resolver = "2"
exclude = ["tools/dev-asset-server"]
members = [
    "engine/deterministic",
    "engine/bridge_types",
    "engine/state_hash",
    "engine/crypto",
    "engine/vm_runtime",
    "build/bytecode_compiler",
    "engine/bevy_runtime",
    "engine/asset_manifest",
    "engine/vm_bevy_bridge",
    # ── Phase 11 ──
    "engine/netcode",
    "server/server_types",
    "server/simulation",
    "server/validator",
    "server/replay_engine",
    # ── Phase 12 ──
    "server/key_exchange",
    "server/hot_update_cdn",
    # ── Phase 13 ──
    "engine/protocol",
    "server/gateway",
    # ── Phase 14 ──
    "engine/shadow_vm",
    "server/anti_cheat",
    # ── Phase 17 ──
    "build/build_utils",
    "build/cfg_mutator",
    "build/asset_encryptor",
    "client/wasm_loader",
    "client/wasm_shadow_worker",
    # ── Asset Pipeline ──
    "tools/manifest-gen",
    # ── Demo ──
    "tools/demo_cli",
    # ── Phase 19 ──
    "tools/replay_debugger",
    "tools/state_inspector",
    "tools/vm_disassembler",
    # ── Phase 20 ──
    "tests/memory",
    # ── OTA ──
    "engine/ota",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Feature flags 定義於各 crate 的 [features] 區段。
# 全域 feature 清單：debug-mode（含 7 個子 feature）、single-player。
# CI/CD 專用 feature：integration、nightly-perf（Phase 19 新增，各 crate 個別定義）。
# 參考：docs/design/architecture/17-build-strategy/feature-flags.md

[workspace.dependencies]
# ── 確定性浮點 ──
# pure Rust softfloat（forked from const_soft_float, by koute），精確釘選
softfloat = "=1.0.0"

# ── RNG ──
# 保留於 workspace 層級供未來 crate 使用
# （engine/deterministic 自行實作 PCG，不直接依賴）
rand_pcg = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }

# ── 雜湊 ──
blake3 = "1"

# ── 序列化 ──
bincode = "1"
serde = { version = "1", features = ["derive"] }
ron = "0.8"

# ── 素材 Manifest ──
walkdir = "2"

# ── 素材熱載入 ──
notify = "6"
crossbeam-channel = "0.5"

# ── 加密 ──
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }
zeroize = { version = "1", features = ["derive"] }

# ── Rhai 腳本引擎 ──
rhai = { version = "1", features = ["only_i64", "no_module", "no_closure", "serde"] }

# ── CLI ──
clap = { version = "4", features = ["derive"] }

# ── 錯誤處理 ──
thiserror = "2"

# ── 非同步 ──
async-trait = "0.1"

# ── HTTP 服務 ──
tower-http = { version = "0.6", features = ["fs"] }

# ── Phase 13: Server Gateway ──
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
wtransport = "0.7"
tower = "0.5"

# ── 日誌 ──
tracing = "0.1"
tracing-subscriber = "0.3"

# ── 監控 ──
prometheus = "0.13"

# ── 遊戲引擎 ──
bevy = { version = "0.15", default-features = false, features = [
    # ── 渲染核心 ──
    "bevy_asset",           # 資產系統
    "bevy_render",          # 渲染後端
    "bevy_core_pipeline",   # Camera2d、core render pass
    "bevy_sprite",          # 2D sprite / Camera2d
    "bevy_text",            # Text2d
    "default_font",         # 內嵌 FiraMono 字型（TextFont::default() 所需）
    # ── 視窗與輸入 ──
    "bevy_winit",           # WASM canvas 事件迴圈（含 ButtonInput<KeyCode>）
    "webgl2",               # WASM WebGL2 渲染後端
    # ── 遊戲邏輯 ──
    "bevy_state",           # States trait、AppState 狀態機、OnEnter/OnExit
    "bevy_animation",       # 動畫系統
    "bevy_scene",           # 場景載入（.scn.ron）
    # ── UI ──
    "bevy_ui",              # Bevy UI（HUD、選單、按鈕）
    "bevy_picking",         # Pointer picking（UI 互動所需）
    # ── 音效 ──
    "bevy_audio",           # 音效播放
    "vorbis",               # OGG/Vorbis 音訊（Web 友善）
    "wav",                  # WAV 音訊
    # ── 圖片格式 ──
    "png",                  # PNG 圖片資產
    "jpeg",                 # JPEG 圖片資產
    # ── 開發工具 ──
    "bevy_gizmos",          # Debug 繪圖（開發期視覺化）
    "bevy_dev_tools",       # FPS overlay 等開發工具
] }

# ── 物理引擎 ──
bevy_rapier3d = { version = "0.29", default-features = false, features = ["dim3"] }

# ── Phase 11: Replay 壓縮 ──
flate2 = "1"
hex = "0.4"

# ── JSON ──
serde_json = "1"

# ── 測試框架 ──
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

# ── Release Profile ──
# 對齊 docs/design/architecture/17-build-strategy/build-profiles.md
[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"
