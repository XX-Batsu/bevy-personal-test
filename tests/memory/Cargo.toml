[package]
name = "memory-leak-tests"
version = "0.0.0"
publish = false
edition = "2021"

[features]
nightly-perf = []

[dependencies]
bridge_types = { path = "../../engine/bridge_types" }
state_hash = { path = "../../engine/state_hash" }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.5", features = ["stats"] }
tikv-jemalloc-ctl = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-test = "0.3"

[[test]]
name = "native_leak_test"
path = "native_leak_test.rs"

[[test]]
name = "wasm_leak_test"
path = "wasm_leak_test.rs"
