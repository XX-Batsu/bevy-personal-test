<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bevy Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- game-wrapper：固定 16:9，居中，letterbox 由 body #000 提供 -->
  <div id="game-wrapper">
    <div id="loading-screen">
      <div class="spinner"></div>
      <p id="loading-text">載入中...</p>
      <p id="error-text" style="display:none; color:red;"></p>
    </div>
    <canvas id="game-canvas" style="display:none;"></canvas>
  </div>
  <script type="module" src="loader.js"></script>
</body>
</html>
