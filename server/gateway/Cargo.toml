[package]
name = "gateway"
version.workspace = true
edition.workspace = true

[features]
default = []
# WebTransport 支援（QUIC/HTTP3），需要 native TLS 環境
webtransport = ["wtransport"]

[dependencies]
# 內部 crate
protocol = { path = "../../engine/protocol" }
crypto = { path = "../../engine/crypto" }
bridge_types = { path = "../../engine/bridge_types" }
key_exchange = { path = "../key_exchange" }

# 網路
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
wtransport = { workspace = true, optional = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures-util = "0.3"
bytes = "1"

# 序列化
serde = { workspace = true }
bincode = { workspace = true }

# 工具
tracing = { workspace = true }
async-trait = { workspace = true }
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "gateway-server"
path = "src/main.rs"
