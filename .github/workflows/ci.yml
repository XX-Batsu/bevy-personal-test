name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quick-check:
    name: "Stage 1: Quick Checks"
    runs-on: ubuntu-latest
    # 冷快取需完整編譯 Bevy 依賴樹，5 分鐘不足
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}

      # bevy_audio → alsa-sys、bevy_winit → libudev 需要系統開發標頭
      - name: 安裝 Linux 系統相依
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      # 不走 justfile：其 shell 為 zsh（ubuntu runner 未安裝，exit 127），
      # 且 download-fonts 的路徑探測針對 macOS。CI 直接取來源字型並子集化。
      - name: 下載並子集化 CJK 字型
        run: bash tools/ci_fonts.sh

      - name: 格式檢查
        run: cargo fmt --check

      - name: Clippy 靜態分析
        run: cargo clippy -- -D warnings

      - name: 確定性檢查（float + HashMap/HashSet）
        run: bash tools/check_determinism.sh

      - name: 編譯檢查
        run: cargo check --all-targets

      - name: 單元測試
        run: cargo test

      - name: Slack 失敗通知
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: 'ci-alerts'
          slack-message: |
            CI Stage 1 失敗
            分支：${{ github.ref_name }}
            提交：${{ github.sha }}
            Run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  wasm-build:
    name: "Stage 2: WASM Build"
    needs: quick-check
    runs-on: ubuntu-latest
    # 冷快取需編譯整棵 Bevy wasm 依賴樹，另加 wasm-bindgen-cli 安裝
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}

      - name: 下載並子集化 CJK 字型
        run: bash tools/ci_fonts.sh

      - name: 安裝 wasm-opt
        run: |
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_116/bin" >> $GITHUB_PATH

      # 版本必須與 Cargo.lock 的 wasm-bindgen 一致，否則 wasm-bindgen 會拒絕產出
      - name: 安裝 wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.117 --locked

      - name: WASM Release 建置
        run: |
          cargo build --release --target wasm32-unknown-unknown \
            --package wasm_loader --features debug-mode
          cargo build --release --target wasm32-unknown-unknown \
            --package wasm_shadow_worker --features debug-mode

      # single-player 不在 demo/release 建置路徑上，需獨立檢查否則會靜默腐化
      - name: single-player feature 編譯檢查
        run: |
          cargo check --target wasm32-unknown-unknown \
            --package wasm_loader --features "debug-mode,single-player"

      # 輸出檔名維持 wasm_loader，wasm-bindgen 才會產出 bootstrap.js 預期的
      # wasm_loader.js / wasm_loader_bg.wasm
      - name: wasm-opt 優化
        run: |
          mkdir -p pkg
          wasm-opt -Oz -o pkg/wasm_loader.wasm \
            target/wasm32-unknown-unknown/release/wasm_loader.wasm

      - name: wasm-bindgen 產出
        run: wasm-bindgen --out-dir client/js --target web pkg/wasm_loader.wasm

      # 上傳可直接開啟的完整頁面（HTML/JS/WASM），供 Stage 3b 瀏覽器測試使用
      - name: 上傳 WASM 產物
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: client/js/
          retention-days: 1

      - name: Slack 失敗通知
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: 'ci-alerts'
          slack-message: |
            CI Stage 2 (WASM Build) 失敗
            Run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  native-integration:
    name: "Stage 3a: Integration Tests (Native)"
    needs: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}

      # bevy_audio → alsa-sys、bevy_winit → libudev 需要系統開發標頭
      - name: 安裝 Linux 系統相依
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      # bevy_runtime/build.rs 要求字型存在才能編譯
      - name: 下載並子集化 CJK 字型
        run: bash tools/ci_fonts.sh

      - name: 整合測試（Native）
        run: cargo test --workspace --features integration

      - name: Golden hash regression
        run: ./tools/golden_hash.sh verify

      - name: Slack 失敗通知
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: 'ci-alerts'
          slack-message: |
            CI Stage 3a (Native Integration) 失敗
            Run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  browser-test:
    name: "Stage 3b: Integration Tests (Browser)"
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 產物覆蓋 checkout 版本的 client/js（wasm-bindgen 產出 + 編譯後的 .wasm）
      - name: 下載 WASM 產物
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: client/js/

      - name: 快取 Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝 Playwright
        run: npm ci

      - name: 安裝 Playwright 瀏覽器
        run: npx playwright install --with-deps chromium

      - name: 執行 Playwright 測試
        run: npx playwright test tests/wasm/

      - name: 上傳 Playwright 報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Slack 失敗通知
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: 'ci-alerts'
          slack-message: |
            CI Stage 3b (Browser Test) 失敗
            Run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
