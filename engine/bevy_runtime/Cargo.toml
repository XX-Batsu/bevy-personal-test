[package]
name = "bevy_runtime"
version = "0.1.0"
edition = "2021"

[features]
plaintext-assets = []
debug-mode = []

[dependencies]
bevy = { workspace = true }
bevy_rapier3d = { workspace = true }
vm_bevy_bridge = { path = "../vm_bevy_bridge" }
vm_runtime = { path = "../vm_runtime" }
deterministic = { path = "../deterministic" }
crypto = { path = "../crypto" }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
rhai = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
bridge_types = { path = "../bridge_types" }
