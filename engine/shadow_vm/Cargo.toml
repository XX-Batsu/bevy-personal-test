[package]
name = "shadow_vm"
version.workspace = true
edition.workspace = true

[dependencies]
bridge_types = { path = "../bridge_types" }
deterministic = { path = "../deterministic" }
state_hash = { path = "../state_hash" }
vm_runtime = { path = "../vm_runtime" }
bincode = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
blake3 = "1"
rhai = { version = "1", features = ["only_i64", "no_module", "no_closure", "serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "shadow_vm"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Worker",
    "MessageEvent",
    "DedicatedWorkerGlobalScope",
    "WorkerGlobalScope",
    "Performance",
] }
js-sys = "0.3"
