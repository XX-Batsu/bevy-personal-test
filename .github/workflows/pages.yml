name: Pages Demo

# 靜態 WASM demo：無 gateway server，client 以離線模式啟動（見 client/js/config.js）。
# 展示範圍＝載入管線 + Bevy 歡迎畫面；不含 netcode、握手與素材解密。

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一次部署，且不中斷進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置 WASM demo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pages"
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}

      # 字型透過 include_bytes! 在編譯期嵌入 WASM，必須先就位。
      # 子集化（build/font-chars.txt）將 ~16 MB 完整 CJK 字型縮至數百 KB。
      - name: 下載並子集化 CJK 字型
        run: bash tools/ci_fonts.sh

      # binaryen 116 不認得 Rust 現行 wasm32 預設輸出的 nontrapping-float-to-int
      # 等指令，會以 "all used features should be allowed" 驗證失敗
      - name: 安裝 wasm-opt
        run: |
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_132/bin" >> $GITHUB_PATH

      # 版本必須與 Cargo.lock 的 wasm-bindgen 一致，否則 wasm-bindgen 會拒絕產出
      - name: 安裝 wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.117 --locked

      - name: 建置 wasm_loader（release + debug-mode）
        run: |
          cargo build --release --target wasm32-unknown-unknown \
            --package wasm_loader --features debug-mode

      # 輸入檔名維持 wasm_loader，wasm-bindgen 才會產出 bootstrap.js 預期的
      # wasm_loader.js / wasm_loader_bg.wasm
      - name: wasm-bindgen（--target web）
        run: |
          wasm-bindgen --out-dir client/js --target web \
            target/wasm32-unknown-unknown/release/wasm_loader.wasm

      # 必須在 wasm-bindgen 之後：先 wasm-opt 會破壞 wasm-bindgen 依賴的
      # function table（failed to find `0` in function table）
      - name: wasm-opt -Oz
        run: bash tools/ci_wasm_opt.sh client/js/wasm_loader_bg.wasm

      - name: 啟用離線 demo 模式
        run: |
          cat > client/js/config.js <<'EOF'
          // 由 .github/workflows/pages.yml 產生 — GitHub Pages 無 gateway server，
          // 因此以離線模式啟動：跳過 WebSocket 連線與 ECDH 握手。
          export const OFFLINE_DEMO = true;
          EOF

      # Jekyll 會忽略底線開頭檔案，且此處不需任何 Jekyll 處理
      - name: 停用 Jekyll
        run: touch client/js/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/js

  deploy:
    name: 部署至 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
