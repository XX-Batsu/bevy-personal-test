[package]
name = "state_hash"
version = "0.1.0"
edition = "2021"
description = "blake3 state hashing for deterministic validation"

[dependencies]
blake3 = { workspace = true }
deterministic = { path = "../deterministic" }
bridge_types = { path = "../bridge_types" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "state_hash_bench"
harness = false
