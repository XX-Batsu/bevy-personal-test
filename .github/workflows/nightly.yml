name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  performance-test:
    name: "Stage 4: Performance Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}

      - name: 全量 Determinism Replay 測試
        run: cargo test --features deterministic-replay

      - name: 效能邊界測試（nightly-perf #[ignore]）
        run: cargo test --features nightly-perf -- --ignored
        env:
          RUST_BACKTRACE: 1
        timeout-minutes: 30

      - name: Benchmark — Shadow VM
        run: cargo bench --bench shadow_vm

      - name: Benchmark — 加密管線
        run: cargo bench --bench encryption

      - name: Benchmark — Netcode
        run: cargo bench --bench netcode

      - name: 安裝 nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: 安裝 cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz bytecode_decoder (300s)
        run: cargo +nightly fuzz run bytecode_decoder fuzz/corpus/bytecode_decoder fuzz/seed_corpus/bytecode_decoder -- -max_total_time=300 -max_len=65536 -rss_limit_mb=2048

      - name: Fuzz netcode_packet_parser (300s)
        run: cargo +nightly fuzz run netcode_packet_parser fuzz/corpus/netcode_packet_parser fuzz/seed_corpus/netcode_packet_parser -- -max_total_time=300 -max_len=65536 -rss_limit_mb=2048

      - name: Fuzz asset_decryptor (300s)
        run: cargo +nightly fuzz run asset_decryptor fuzz/corpus/asset_decryptor fuzz/seed_corpus/asset_decryptor -- -max_total_time=300 -max_len=1048576 -rss_limit_mb=2048

      - name: Fuzz state_hash_calculator (300s)
        run: cargo +nightly fuzz run state_hash_calculator fuzz/corpus/state_hash_calculator fuzz/seed_corpus/state_hash_calculator -- -max_total_time=300 -rss_limit_mb=2048

      - name: 記憶體穩定性測試（native, Linux jemalloc）
        run: cargo test -p memory-leak-tests --features nightly-perf --test native_leak_test -- --ignored
        timeout-minutes: 10

      - name: 上傳 fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          retention-days: 30

      - name: Nightly 失敗通知
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: 'ci-alerts'
          slack-message: |
            Nightly Stage 4 (Performance) 失敗
            日期：${{ github.run_started_at }}
            Run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
